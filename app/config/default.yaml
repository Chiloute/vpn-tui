# vpn-tui: default configuration.
# Overrides: ~/.config/vpn-tui/config.yaml (same keys). Several keys: "up,k".
keybinds:
  global.help: "?"
  global.quit: "q"
  global.panic: "!"
  global.logs: "shift+l"
  global.copyLhost: "c"
  profiles.nav: "up,down,j,k"
  profiles.toggle: "return"
  profiles.detail: "d"
  profiles.scope: "s"
  profiles.import: "i"
  profiles.new: "n"
  profiles.edit: "e"
  profiles.delete: "x"
  detail.scope: "s"
  detail.edit: "e"
  detail.back: "escape"
  logs.nav: "up,down,j,k"
  logs.page: "pageup,pagedown"
  logs.back: "escape"
  import.confirm: "return"
  import.next: "tab"
  import.prev: "shift+tab"
  import.cancel: "escape"
  edit.next: "tab"
  edit.prev: "shift+tab"
  edit.submit: "return"
  edit.save: "ctrl+s"
  edit.cancel: "escape"
  help.scroll: "up,down,j,k"
  help.page: "pageup,pagedown"
  help.close: "escape"
  confirm.yes: "y"
  confirm.no: "n,escape"
